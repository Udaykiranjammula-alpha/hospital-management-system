<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare HMS - Secure Glass Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <!-- Cinematic Live Movie Background Video (Real Hospital Walkthrough Footage) -->
    <video class="cinematic-video-bg" id="bgVideo" autoplay muted loop playsinline src="videos/hospital-corridor-walk.mp4"></video>
    <div class="cinematic-overlay"></div>

    <!-- 4K Cinematic Live Movie Badge -->
    <div class="cinematic-hud-badge">
        <span class="rec-dot"></span>
        <span>LIVE CINEMATIC MOVIE 4K</span>
        <span style="color: var(--primary); margin-left: 2px;">60FPS</span>
    </div>

    <!-- Movie Scene Switcher -->
    <div class="video-scene-selector" id="sceneSelector">
        <button class="scene-btn active" onclick="switchMovie('videos/hospital-corridor-walk.mp4', this)"><i class="fas fa-video"></i> Corridor Walk</button>
        <button class="scene-btn" onclick="switchMovie('videos/corridor-walkthrough-loop.mp4', this)"><i class="fas fa-cube"></i> Sci-Fi Corridor</button>
        <button class="scene-btn" onclick="switchMovie('videos/hospital-reception.mp4', this)"><i class="fas fa-hospital-user"></i> Hospital Ward</button>
        <button class="scene-btn" onclick="toggleCanvasMode(this)"><i class="fas fa-wand-magic-sparkles"></i> 3D Canvas</button>
    </div>

    <div class="ambient-background">
        <canvas id="liveWallpaperCanvas" style="display: none;"></canvas>
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-grid"></div>
    </div>

    <div class="login-container">
        <div style="position: absolute; top: 16px; right: 16px; display: flex; gap: 8px;">
            <button class="btn-icon sound-toggle" onclick="toggleSound()" title="Toggle UI Sound"><i class="fas fa-volume-up"></i></button>
            <button class="btn-icon wallpaper-toggle" onclick="cycleWallpaperMode()" title="Switch Interactive Live Wallpaper"><i class="fas fa-magic"></i></button>
            <button class="btn-icon theme-toggle" onclick="toggleTheme()" title="Switch Glass Theme"><i class="fas fa-moon"></i></button>
        </div>

        <div class="login-header">
            <i class="fas fa-hospital"></i>
            <h1>MediCare HMS</h1>
            <p>Next-Gen Healthcare Management System</p>
        </div>

        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event);">
            <div class="form-group">
                <label class="form-label">Select System Role</label>
                <div class="role-selector">
                    <button type="button" class="role-btn active" data-role="admin">
                        <i class="fas fa-user-shield"></i>
                        <span>Admin</span>
                    </button>
                    <button type="button" class="role-btn" data-role="doctor">
                        <i class="fas fa-user-md"></i>
                        <span>Doctor</span>
                    </button>
                    <button type="button" class="role-btn" data-role="receptionist">
                        <i class="fas fa-user-nurse"></i>
                        <span>Reception</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username / ID</label>
                <div style="position: relative;">
                    <input type="text" class="form-control" id="username" placeholder="Enter username or ID" value="admin" required style="padding-left: 40px;">
                    <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" id="password" placeholder="Enter password" value="password123" required style="padding-left: 40px;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" onclick="handleLogin(event)" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 1rem;">
                Authenticate & Enter <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--glass-border); text-align: center;">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Demo One-Click Autofill:</p>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button type="button" class="btn btn-sm btn-outline" onclick="autofill('admin', 'admin')">Admin</button>
                <button type="button" class="btn btn-sm btn-outline" onclick="autofill('Dr. Sharma', 'doctor')">Doctor</button>
                <button type="button" class="btn btn-sm btn-outline" onclick="autofill('Reception', 'receptionist')">Reception</button>
            </div>
        </div>

        <div class="login-footer">
            <p>© 2026 MediCare Super Specialty Hospital. All rights reserved.</p>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/app.js"></script>
        <script>
        function autofill(user, role) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = 'securepass';
            document.querySelectorAll('.role-btn').forEach(btn => {
                if (btn.getAttribute('data-role') === role) btn.click();
            });
        }

        function switchMovie(src, btn) {
            const v = document.getElementById('bgVideo');
            const c = document.getElementById('liveWallpaperCanvas');
            if (v) {
                v.style.display = 'block';
                v.src = src;
                v.play().catch(() => {});
            }
            if (c) c.style.display = 'none';
            document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (typeof playSound === 'function') playSound('click');
        }

        function toggleCanvasMode(btn) {
            const v = document.getElementById('bgVideo');
            const c = document.getElementById('liveWallpaperCanvas');
            if (v) v.style.display = 'none';
            if (c) {
                c.style.display = 'block';
                if (typeof injectAmbientBackground === 'function') {
                    injectAmbientBackground();
                }
            }
            document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (typeof playSound === 'function') playSound('click');
        }
        
        // Fallback handleLogin in case app.js is still caching
        if (typeof handleLogin !== 'function') {
            window.handleLogin = function(e) {
                if (e && e.preventDefault) e.preventDefault();
                var userInput = document.getElementById('username') ? document.getElementById('username').value : 'Admin';
                var activeRoleBtn = document.querySelector('.role-btn.active');
                var selectedRole = activeRoleBtn ? (activeRoleBtn.getAttribute('data-role') || 'admin') : 'admin';
                var roleCap = selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1);
                localStorage.setItem('hms_username', userInput);
                localStorage.setItem('hms_user_role', roleCap);
                if (typeof startHospitalWarpSequence === 'function') {
                    startHospitalWarpSequence(function() {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    window.location.href = 'dashboard.html';
                }
                return false;
            };
        }
    </script>
</body>
</html>
